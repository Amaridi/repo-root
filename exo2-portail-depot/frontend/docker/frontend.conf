# Service de fichiers statiques pour la SPA.
#
# Ce nginx est INTERNE au reseau du compose : il n a aucun port publie et ne
# voit jamais l Internet. La terminaison TLS, la redirection HTTP et le routage
# /api sont l affaire de la passerelle (infra/nginx/).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les journaux d acces sont deja produits par la passerelle en amont : les
    # dupliquer ici ne ferait que doubler le volume.
    access_log off;

    # Repli SPA : /demandes/42 et /d/<token> sont des routes React, pas des
    # fichiers. Sans cette ligne, un rechargement de page renvoie 404 — et pour
    # le parcours client c est le lien lui-meme qui serait casse.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les actifs compiles portent une empreinte dans leur nom : ils sont
    # immuables, donc cachables indefiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ne doit JAMAIS etre mis en cache : c est lui qui reference les
    # empreintes des actifs. Un index.html perime pointerait sur des fichiers
    # supprimes, et l application resterait blanche apres un deploiement.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
